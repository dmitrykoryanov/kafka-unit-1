spring.application.name=kafka-unit-1

# Адреса брокеров для запуска с хоста. В Docker переопределяются переменной окружения KAFKA_BOOTSTRAP_SERVERS.
kafka.bootstrap-servers=localhost:9093,localhost:9094,localhost:9095
kafka.topic=kafka_topic

# Группы консьюмеров. Чтобы консьюмер перечитал топик с начала, достаточно сменить его группу.
kafka.single-consumer.group-id=single-message-group
kafka.batch-consumer.group-id=batch-message-group
